services:
  postgres:
    image: postgres:16-alpine
    container_name: summit-okr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: summitokr
      POSTGRES_PASSWORD: summitokr123
      POSTGRES_DB: summit_okr
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U summitokr -d summit_okr"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: summit-okr-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
